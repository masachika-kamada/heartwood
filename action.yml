name: Heartwood
description: Draw a GitHub repository's or person's history as a tree trunk's growth rings, as image files for a README.
branding:
  icon: disc
  color: orange

inputs:
  target:
    description: "`owner/repository`, or a username. Defaults to the owner of the repository the workflow runs in."
    default: ${{ github.repository_owner }}
  output:
    description: Directory the images are written to, relative to the workspace.
    default: heartwood
  name:
    description: File name stem. The files are `<name>-dark.webp` and `<name>-light.webp`.
    default: heartwood
  readme:
    description: Markdown file whose `<!-- heartwood:start -->` … `<!-- heartwood:end -->` section is filled in with the trunk and its hoverable core sample. Left alone if it has no such section.
    default: README.md
  width:
    description: Width in pixels the README shows the trunk and the core sample at.
    default: "600"
  token:
    description: Token used to read the history. The workflow's own token is enough for public activity.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build Heartwood
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund
        npm run build
    - name: Draw the trunk
      shell: bash
      env:
        HEARTWOOD_TARGET: ${{ inputs.target }}
        HEARTWOOD_OUT: ${{ github.workspace }}/${{ inputs.output }}
        HEARTWOOD_NAME: ${{ inputs.name }}
        HEARTWOOD_TOKEN: ${{ inputs.token }}
        HEARTWOOD_README: ${{ github.workspace }}/${{ inputs.readme }}
        HEARTWOOD_WIDTH: ${{ inputs.width }}
      run: node "${{ github.action_path }}/scripts/render.mjs"
